<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Asistencia Iglesia - Control de Asistencia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between antialiased">

    <!-- 상단 헤더 (모바일 앱 스타일) -->
    <header class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white px-5 py-4 shadow-md flex justify-between items-center">
        <div>
            <h1 id="header-title" class="text-base font-bold tracking-tight">🏛️ Control de Asistencia</h1>
            <p id="header-sub" class="text-xs text-indigo-200 mt-0.5">Seleccione su distrito y nombre</p>
        </div>
        <!-- 언어 전환 버튼 -->
        <div class="bg-indigo-900/40 p-1 rounded-xl flex space-x-1 border border-indigo-400/30">
            <button onclick="setLanguage('es')" id="btn-lang-es" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-white text-indigo-700 shadow-sm transition">ES</button>
            <button onclick="setLanguage('ko')" id="btn-lang-ko" class="px-2.5 py-1 text-xs font-bold rounded-lg text-indigo-200 hover:text-white transition">KO</button>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 (스마트폰 크기 제한) -->
    <main class="px-4 py-6 max-w-md mx-auto w-full flex-grow flex flex-col justify-center">

        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 space-y-5">

            <!-- 1단계: 구역 선택 화면 -->
            <div id="step-district" class="space-y-4">
                <div class="flex items-center space-x-2">
                    <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-full">1</span>
                    <h2 id="txt-select-district" class="text-base font-bold text-slate-800">Seleccione su Distrito</h2>
                </div>
                <div id="district-list" class="grid grid-cols-2 gap-2.5">
                    <div id="txt-loading" class="text-center py-8 text-slate-400 col-span-2 text-sm">Cargando... ⏳</div>
                </div>
            </div>

            <!-- 2단계: 성도 이름 선택 화면 -->
            <div id="step-member" class="space-y-4 hidden">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-full">2</span>
                        <h2 id="selected-district-title" class="text-base font-bold text-indigo-700">Distrito</h2>
                    </div>
                    <button onclick="goBackToDistrict()" id="txt-back-district" class="text-xs text-slate-400 hover:text-indigo-600 font-medium underline">← Cambiar</button>
                </div>
                <p id="txt-select-name" class="text-xs text-slate-400">Seleccione su nombre de la lista.</p>
                <div id="member-list" class="grid grid-cols-1 gap-2 max-h-72 overflow-y-auto pr-1"></div>
            </div>

            <!-- 3단계: 참석 방식 선택 화면 -->
            <div id="step-submit" class="space-y-4 hidden">
                <div class="bg-indigo-50/70 p-3.5 rounded-xl border border-indigo-100 text-center">
                    <span id="txt-selected-member-label" class="text-[11px] uppercase tracking-wider text-indigo-500 font-bold">Miembro seleccionado</span>
                    <h3 id="confirm-name" class="text-lg font-extrabold text-indigo-900 mt-0.5">Nombre</h3>
                </div>

                <div class="flex items-center space-x-2 pt-1">
                    <span class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-full">3</span>
                    <h2 id="txt-select-method" class="text-base font-bold text-slate-800">Tipo de asistencia</h2>
                </div>

                <div class="space-y-2.5">
                    <label class="flex items-center p-3.5 border border-slate-200 rounded-xl bg-white shadow-sm cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/30 transition">
                        <input type="radio" name="attendMethod" value="Presencial" checked class="text-indigo-600 w-4 h-4 focus:ring-indigo-500">
                        <span id="txt-method-1" class="ml-3 text-sm font-semibold text-slate-700">Presencial</span>
                    </label>
                    <label class="flex items-center p-3.5 border border-slate-200 rounded-xl bg-white shadow-sm cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/30 transition">
                        <input type="radio" name="attendMethod" value="Virtual" class="text-indigo-600 w-4 h-4 focus:ring-indigo-500">
                        <span id="txt-method-2" class="ml-3 text-sm font-semibold text-slate-700">Virtual (Cámara ON)</span>
                    </label>
                    <label class="flex items-center p-3.5 border border-slate-200 rounded-xl bg-white shadow-sm cursor-pointer hover:border-indigo-500 hover:bg-indigo-50/30 transition">
                        <input type="radio" name="attendMethod" value="Other" class="text-indigo-600 w-4 h-4 focus:ring-indigo-500">
                        <span id="txt-method-3" class="ml-3 text-sm font-semibold text-slate-700">Otro / Culto alternativo</span>
                    </label>
                </div>

                <button onclick="submitAttendance()" id="btn-submit" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold py-3.5 rounded-xl shadow-md hover:from-indigo-700 hover:to-violet-700 active:scale-[0.99] transition mt-2">
                    Completar Asistencia ✨
                </button>
                <button onclick="goBackToMember()" id="txt-back-name" class="w-full text-center text-xs text-slate-400 hover:text-slate-600 font-medium pt-1">← Cambiar nombre</button>
            </div>

            <!-- 완료 화면 -->
            <div id="step-complete" class="text-center py-8 hidden space-y-4">
                <div class="text-5xl animate-bounce">🎉</div>
                <h2 id="txt-complete-title" class="text-xl font-extrabold text-slate-800">¡Asistencia registrada!</h2>
                <p id="txt-complete-sub" class="text-xs text-slate-500">Que tenga un día bendecido.</p>
                <button onclick="location.reload()" id="txt-restart" class="w-full bg-slate-100 text-slate-700 text-xs font-bold py-3 rounded-xl hover:bg-slate-200 transition mt-4">
                    Volver al inicio
                </button>
            </div>

        </div>
    </main>

    <!-- 푸터 -->
    <footer class="text-center p-4 text-[11px] text-slate-400">
        &copy; 2026 Iglesia Asistencia System
    </footer>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyv0kbD63R8hNNWIt-4lOXA7XVrt1Tp01C16DkHEN5xTfTD6nOHyNZr91Jct6_3PfMt/exec";

        let districtData = {};
        let selectedDistrict = "";
        let selectedMember = "";
        let currentLang = 'es';

        const translations = {
            es: {
                pageTitle: "Asistencia Iglesia - Control de Asistencia",
                headerTitle: "🏛️ Control de Asistencia",
                headerSub: "Seleccione su distrito y nombre",
                selectDistrict: "Seleccione su Distrito",
                loading: "Cargando... ⏳",
                backDistrict: "← Cambiar",
                selectName: "Seleccione su nombre de la lista.",
                selectedMemberLabel: "Miembro seleccionado",
                selectMethod: "Tipo de asistencia",
                method1: "Presencial",
                method2: "Virtual (Cámara ON)",
                method3: "Otro / Culto alternativo",
                submitBtn: "Completar Asistencia ✨",
                backName: "← Cambiar nombre",
                completeTitle: "¡Asistencia registrada!",
                completeSub: "Que tenga un día bendecido.",
                restart: "Volver al inicio",
                errorMsg: "No se pudo cargar la lista. Verifique la URL."
            },
            ko: {
                pageTitle: "교회 출석 체크 - Asistencia Iglesia",
                headerTitle: "🏛️ 교회 출석 체크",
                headerSub: "구역과 본인 이름을 선택해 주세요",
                selectDistrict: "소속 구역을 선택하세요",
                loading: "불러오는 중... ⏳",
                backDistrict: "← 구역 변경",
                selectName: "목록에서 본인의 이름을 선택해주세요.",
                selectedMemberLabel: "선택된 성도",
                selectMethod: "참석 방식 선택",
                method1: "대면 예배",
                method2: "온라인 예배 (화면 ON)",
                method3: "기타 / 대체 예배",
                submitBtn: "출석 완료하기 ✨",
                backName: "← 이름 다시 선택",
                completeTitle: "출석 체크 완료!",
                completeSub: "은혜로운 하루 되세요.",
                restart: "처음으로 돌아가기",
                errorMsg: "명단을 불러오지 못했습니다. URL을 확인해주세요."
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            if (lang === 'es') {
                document.getElementById('btn-lang-es').className = "px-2.5 py-1 text-xs font-bold rounded-lg bg-white text-indigo-700 shadow-sm transition";
                document.getElementById('btn-lang-ko').className = "px-2.5 py-1 text-xs font-bold rounded-lg text-indigo-200 hover:text-white transition";
            } else {
                document.getElementById('btn-lang-ko').className = "px-2.5 py-1 text-xs font-bold rounded-lg bg-white text-indigo-700 shadow-sm transition";
                document.getElementById('btn-lang-es').className = "px-2.5 py-1 text-xs font-bold rounded-lg text-indigo-200 hover:text-white transition";
            }

            document.getElementById('page-title').innerText = t.pageTitle;
            document.getElementById('header-title').innerText = t.headerTitle;
            document.getElementById('header-sub').innerText = t.headerSub;
            document.getElementById('txt-select-district').innerText = t.selectDistrict;
            document.getElementById('txt-back-district').innerText = t.backDistrict;
            document.getElementById('txt-select-name').innerText = t.selectName;
            document.getElementById('txt-selected-member-label').innerText = t.selectedMemberLabel;
            document.getElementById('txt-select-method').innerText = t.selectMethod;
            document.getElementById('txt-method-1').innerText = t.method1;
            document.getElementById('txt-method-2').innerText = t.method2;
            document.getElementById('txt-method-3').innerText = t.method3;
            document.getElementById('btn-submit').innerText = t.submitBtn;
            document.getElementById('txt-back-name').innerText = t.backName;
            document.getElementById('txt-complete-title').innerText = t.completeTitle;
            document.getElementById('txt-complete-sub').innerText = t.completeSub;
            document.getElementById('txt-restart').innerText = t.restart;

            const loadingEl = document.getElementById('txt-loading');
            if (loadingEl) loadingEl.innerText = t.loading;

            if (selectedDistrict) {
                document.getElementById('selected-district-title').innerText = selectedDistrict;
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(GAS_API_URL);
                districtData = await response.json();
                renderDistricts();
            } catch (err) {
                console.error(err);
                const t = translations[currentLang];
                document.getElementById('district-list').innerHTML = `<div class="text-red-500 col-span-2 text-center text-xs">${t.errorMsg}</div>`;
            }
        });

        function renderDistricts() {
            const container = document.getElementById('district-list');
            container.innerHTML = '';
            
            for (const district in districtData) {
                const btn = document.createElement('button');
                btn.className = "bg-slate-50 hover:bg-indigo-50 text-indigo-900 font-semibold p-3 rounded-xl border border-slate-200/80 hover:border-indigo-300 shadow-sm active:scale-[0.98] transition text-sm text-center truncate";
                btn.innerText = district;
                btn.onclick = () => selectDistrict(district);
                container.appendChild(btn);
            }
        }

        function selectDistrict(district) {
            selectedDistrict = district;
            document.getElementById('selected-district-title').innerText = district;
            
            const memberContainer = document.getElementById('member-list');
            memberContainer.innerHTML = '';

            districtData[district].forEach(name => {
                const btn = document.createElement('button');
                btn.className = "bg-slate-50 hover:bg-indigo-50 text-slate-700 hover:text-indigo-700 font-medium p-3 rounded-xl border border-slate-200/80 hover:border-indigo-300 shadow-sm transition flex justify-between items-center text-sm";
                btn.innerHTML = `<span class="truncate">${name}</span> <span class="text-indigo-400 text-xs font-semibold pl-2">${currentLang === 'es' ? 'Seleccionar →' : '선택 →'}</span>`;
                btn.onclick = () => selectMember(name);
                memberContainer.appendChild(btn);
            });

            document.getElementById('step-district').classList.add('hidden');
            document.getElementById('step-member').classList.remove('hidden');
        }

        function selectMember(name) {
            selectedMember = name;
            document.getElementById('confirm-name').innerText = name;
            document.getElementById('step-member').classList.add('hidden');
            document.getElementById('step-submit').classList.remove('hidden');
        }

        function goBackToDistrict() {
            document.getElementById('step-member').classList.add('hidden');
            document.getElementById('step-district').classList.remove('hidden');
        }

        function goBackToMember() {
            document.getElementById('step-submit').classList.add('hidden');
            document.getElementById('step-member').classList.remove('hidden');
        }

        async function submitAttendance() {
            const method = document.querySelector('input[name="attendMethod"]:checked').value;
            
            const payload = {
                district: selectedDistrict,
                name: selectedMember,
                method: method
            };

            try {
                const res = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                
                if (result.success) {
                    document.getElementById('step-submit').classList.add('hidden');
                    document.getElementById('step-complete').classList.remove('hidden');
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (err) {
                alert('Error de conexión.');
                console.error(err);
            }
        }
    </script>
</body>
</html>
